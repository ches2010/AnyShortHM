name: Build Tauri HAP (OHOS)

# 用 HUAWEI command-line-tools（hvigorw / ohpm / hdc + SDK）构建 Tauri 版鸿蒙 HAP。
# 无需 Rust ohos target：构建主体是 hvigor，Rust 侧产物不参与 HAP 打包。
#
# 启用自建 Runner（可选）：Settings -> Actions -> Runners 注册标签 ohos，
# 再在 Settings -> Variables 设 OHOS_RUNNER_ENABLED=true，
# 否则只跑容器预检 + 前端构建，跳过 HAP 打包。

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: self-hosted Runner 的额外标签
        required: true
        default: ohos
        type: string
      publish_release:
        description: 构建成功后刷新 Tauri 版 Release
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - tauri/**
      - .github/workflows/build-tauri-hap.yml

concurrency:
  group: build-tauri-hap-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  RELEASE_TAG: v1.0.0-beta.1-tauri
  RELEASE_NAME: Beta 1.0.0 (Tauri)
jobs:
  build-hap:
    name: 构建 HAP (command-line-tools)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/dalongzhuazi/harmonyos-ci:api26r
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 工具链自检
        run: |
          set -eu
          node -v
          for c in hvigorw ohpm hdc; do
            if command -v "$c" >/dev/null 2>&1; then
              echo "$c: $(command -v "$c")"
            else
              echo "$c: MISSING"
            fi
          done
          hvigorw -v || true
          echo "OHOS_HOME=${OHOS_HOME:-unset}"
          echo "OHOS_SDK_HOME=${OHOS_SDK_HOME:-unset}"

      - name: 构建 HAP (hvigorw)
        run: |
          if [ -n "${OHOS_PROJECT_DIR:-}" ] && [ -d "$OHOS_PROJECT_DIR" ]; then
            echo "使用外部壳工程: $OHOS_PROJECT_DIR"
          else
            SHELL_DIR="$PWD"
            echo "未指定 OHOS_PROJECT_DIR, 使用仓库根目录 ArkTS 工程作为壳: $SHELL_DIR"
            export OHOS_PROJECT_DIR="$SHELL_DIR"
          fi
          bash tauri/scripts/build-ohos.sh


      - name: 产物校验
        run: |
          set -eu
          ls -lh dist-tauri
          shopt -s nullglob
          haps=(dist-tauri/*.hap)
          if [ ${#haps[@]} -eq 0 ]; then
            echo "::error::未产出 HAP"
            exit 1
          fi
          echo "共 ${#haps[@]} 个 HAP"

      - name: 上传 HAP
        uses: actions/upload-artifact@v4
        with:
          name: hap-tauri-unsigned
          path: dist-tauri/
          if-no-files-found: error
          retention-days: 14

  release:
    name: 发布 Release
    needs: build-hap
    if: ${{ inputs.publish_release == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载 HAP
        uses: actions/download-artifact@v4
        with:
          name: hap-tauri-unsigned
          path: dist-tauri

      - name: 发布 (GitHub API)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          TAG="$RELEASE_TAG"
          gh api -X DELETE "repos/$GH_REPO/releases/tags/$TAG" >/dev/null 2>&1 || true
          gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$TAG" >/dev/null 2>&1 || true
          NOTES=$(printf "## %s\n\nTauri 2 + Vue 3 重构版（鸿蒙）。\n\n- 用 HUAWEI command-line-tools (hvigorw) 构建，附件为**未签名** HAP\n- 安装前请用 DevEco Studio 或 hap-sign-tool 重签\n- 设备要求：HarmonyOS NEXT（API 12+），arm64-v8a\n- Commit: `%s`\n" "$RELEASE_NAME" "$GITHUB_SHA")
          RID=$(gh api -X POST "repos/$GH_REPO/releases" \
            -f tag_name="$TAG" \
            -f target_commitish="$GITHUB_SHA" \
            -f name="$RELEASE_NAME ($TAG)" \
            -F prerelease=true \
            -f body="$NOTES" \
            --jq ".id")
          echo "release id: $RID"
          shopt -s nullglob
          for f in dist-tauri/*.hap; do
            echo "uploading $f"
            gh api -X POST "https://uploads.github.com/repos/$GH_REPO/releases/$RID/assets?name=$(basename "$f")" \
              -H "Content-Type: application/octet-stream" --input "$f" >/dev/null
          done
          gh api "repos/$GH_REPO/releases/tags/$TAG" --jq ".html_url"
