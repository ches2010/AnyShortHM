name: Build HAP

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  CLT_DIR: /home/runner/harmonyos-sdk/command-line-tools

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (required by sdkmgr)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Download command-line tools
        id: sdk
        uses: harmonyos-dev/setup-harmonyos-sdk@0.2.0

      - name: Install HarmonyOS API 12 toolchains (sdkmgr)
        run: |
          export JAVA_TOOL_OPTIONS="$JAVA_TOOL_OPTIONS -Duser.country=CN"
          SDKMGR="$CLT_DIR/sdkmanager/bin/sdkmgr"
          chmod +x "$SDKMGR"
          cd /home/runner/harmonyos-sdk
          "$SDKMGR" install toolchains:12 OpenHarmony/toolchains:12 --accept-license

      - name: Install hvigor from the HarmonyOS npm registry
        run: |
          npm config set @ohos:registry=https://repo.harmonyos.com/npm/
          npm install @ohos/hvigor @ohos/hvigor-ohos-plugin

      - name: Build HAP (unsigned)
        run: |
          set -x
          export HOS_SDK_HOME=/home/runner/harmonyos-sdk/hwsdk
          export DEVECO_SDK_HOME=/home/runner/harmonyos-sdk/hwsdk
          export PATH="$CLT_DIR/bin:$PATH"
          cd "$GITHUB_WORKSPACE"
          if [ -x "$(command -v hvigorw)" ]; then
            hvigorw --mode module -p product=default assembleHap --no-daemon
          elif [ -f ./node_modules/.bin/hvigor ]; then
            ./node_modules/.bin/hvigor --mode module -p product=default assembleHap --no-daemon
          else
            node "$CLT_DIR/hvigor/bin/hvigor.js" --mode module -p product=default assembleHap --no-daemon
          fi

      - name: Upload HAP artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnyShortHM-hap
          path: entry/build/default/outputs/default/*.hap
          if-no-files-found: error
