name: Build HAP

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-hap-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

defaults:
  run:
    shell: bash

env:
  APP_VERSION: 1.0.0-beta.1
  RELEASE_TAG: v1.0.0-beta.1
  RELEASE_NAME: Beta 1.0.0

jobs:
  build:
    name: 构建 HAP (debug, 未签名)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/dalongzhuazi/harmonyos-ci:api26r
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 剥离本机签名配置 / Strip local signing config
        run: |
          if [ -f .github/scripts/strip_signing.py ]; then
            python3 .github/scripts/strip_signing.py build-profile.json5
          else
            echo "::notice::strip_signing.py not found, skipped"
          fi

      - name: 缓存 hvigor & oh_modules / Cache
        uses: actions/cache@v4
        with:
          path: |
            /root/.hvigor
            **/oh_modules
          key: hvigor-${{ runner.os }}-${{ hashFiles('**/oh-package-lock.json5') }}
          restore-keys: |
            hvigor-${{ runner.os }}-

      - name: 安装依赖 / Install dependencies (ohpm)
        run: ohpm install --all

      - name: 仅保留 arm64-v8a / Keep arm64-v8a only (drop x86_64)
        run: |
          set -eu
          removed=0
          while IFS= read -r d; do
            rm -rf "$d"
            echo "removed $d"
            removed=$((removed + 1))
          done < <(find . -type d -path '*/oh_modules/*/libs/x86_64' 2>/dev/null || true)
          if [ "$removed" -eq 0 ]; then
            echo "::warning::no x86_64 native dir found (already clean?)"
          fi
          echo "removed_dirs=$removed"
          find . -type d -path '*/oh_modules/*/libs/*' -maxdepth 8 2>/dev/null | head -20

      - name: 构建 HAP / Build HAP (debug)
        run: hvigorw assembleHap --mode module -p product=default -p buildMode=debug --no-daemon --stacktrace

      - name: 收集并校验产物 / Collect & verify HAP
        run: |
          set -eu
          mkdir -p dist
          find . -type f -name '*.hap' -path '*/outputs/*' \
            -not -path './oh_modules/*' -not -path './node_modules/*' \
            -exec cp -v {} dist/ \;
          shopt -s nullglob
          haps=(dist/*.hap)
          if [ ${#haps[@]} -eq 0 ]; then
            echo "::error::No .hap produced - check the build log"
            exit 1
          fi
          for h in "${haps[@]}"; do
            echo "$h : $(stat -c%s "$h") bytes"
          done

      - name: 上传 artifact / Upload HAP artifact
        uses: actions/upload-artifact@v4
        with:
          name: hap-unsigned
          path: dist/
          if-no-files-found: error
          retention-days: 14

  release:
    name: 发布 Release / Publish release
    needs: build
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: write
    steps:
      - name: 清理旧 Release 与 Tag / Drop previous release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag 2>/dev/null || echo "no existing release for $RELEASE_TAG"

      - name: 下载 HAP artifact / Download HAP artifact
        uses: actions/download-artifact@v4
        with:
          name: hap-unsigned
          path: dist

      - name: 创建或更新 Release / Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }} (${{ env.RELEASE_TAG }})
          prerelease: true
          fail_on_unmatched_files: true
          files: dist/*.hap
          body: |
            ## Beta 1.0.0

            AnyShort 鸿蒙客户端 Beta 版（IJK / FFmpeg 播放内核）。

            ### 本版内容
            - 首页 / 搜索 / 详情 / 剧集列表
            - IJK（FFmpeg）播放内核：清晰度切换（保留进度）、倍速、快退快进 10 秒、上/下集、字幕
            - 全屏按视频方向自适应（竖屏沉浸式 / 横屏旋转）
            - 收藏 / 观看历史 / 评分 / Google 登录

            ### 安装说明
            附件为 **未签名** HAP，安装前请用 DevEco Studio（自动签名）或 `hap-sign-tool` 重新签名。

            设备要求：HarmonyOS NEXT（API 12 及以上）。

            ### 构建信息
            - Commit: `${{ github.sha }}`
            - 工具链：command-line-tools 26.0.0.821（API 26）
