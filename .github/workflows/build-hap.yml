name: Build HAP

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-hap-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

defaults:
  run:
    shell: bash

env:
  APP_VERSION: 1.0.0-beta.1
  RELEASE_TAG: v1.0.0-beta.1
  RELEASE_NAME: Beta 1.0.0

jobs:
  build:
    name: 构建 HAP (debug, 未签名)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/dalongzhuazi/harmonyos-ci:api26r
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 剥离本机签名配置 / Strip local signing config
        run: |
          if [ -f .github/scripts/strip_signing.py ]; then
            python3 .github/scripts/strip_signing.py build-profile.json5
          else
            echo "::notice::strip_signing.py not found, skipped"
          fi

      - name: 缓存 hvigor & oh_modules / Cache
        uses: actions/cache@v4
        with:
          path: |
            /root/.hvigor
            **/oh_modules
          key: hvigor-${{ runner.os }}-${{ hashFiles('**/oh-package-lock.json5') }}
          restore-keys: |
            hvigor-${{ runner.os }}-

      - name: 安装依赖 / Install dependencies (ohpm)
        run: ohpm install --all

      - name: 仅保留 arm64-v8a / Keep arm64-v8a only (drop x86_64)
        run: |
          set -eu
          removed=0
          while IFS= read -r d; do
            rm -rf "$d"
            echo "removed $d"
            removed=$((removed + 1))
          done < <(find . -type d -path '*/oh_modules/*/libs/x86_64' 2>/dev/null || true)
          if [ "$removed" -eq 0 ]; then
            echo "::warning::no x86_64 native dir found (already clean?)"
          fi
          echo "removed_dirs=$removed"

      - name: 构建 HAP / Build HAP (debug)
        run: hvigorw assembleHap --mode module -p product=default -p buildMode=debug --no-daemon --stacktrace

      - name: 收集并校验产物 / Collect & verify HAP
        run: |
          set -eu
          mkdir -p dist
          find . -type f -name '*.hap' -path '*/outputs/*' \
            -not -path './oh_modules/*' -not -path './node_modules/*' \
            -exec cp -v {} dist/ \;
          shopt -s nullglob
          haps=(dist/*.hap)
          if [ ${#haps[@]} -eq 0 ]; then
            echo "::error::No .hap produced - check the build log"
            exit 1
          fi
          for h in "${haps[@]}"; do
            echo "$h : $(stat -c%s "$h") bytes"
          done

      - name: 上传 artifact / Upload HAP artifact
        uses: actions/upload-artifact@v4
        with:
          name: hap-unsigned
          path: dist/
          if-no-files-found: error
          retention-days: 14

  release:
    name: 发布 Release / Publish release
    needs: build
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: write
    steps:
      - name: 下载 HAP artifact / Download HAP artifact
        uses: actions/download-artifact@v4
        with:
          name: hap-unsigned
          path: dist

      - name: 发布 Release（幂等）/ Publish release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          TAG="$RELEASE_TAG"
          REPO="$GH_REPO"

          NOTES=$(printf '## %s\n\nAnyShort 鸿蒙客户端（IJK / FFmpeg 播放内核）。\n\n- 附件为**未签名** HAP，安装前请用 DevEco Studio（自动签名）或 hap-sign-tool 重新签名\n- 设备要求：HarmonyOS NEXT（API 12 及以上）\n- Commit: `%s`\n- 工具链：command-line-tools 26.0.0.821（API 26）\n' "$RELEASE_NAME" "$GITHUB_SHA")

          # 找到同名 release（含 draft），只保留最新的一条；绝不删 git tag
          RID=$(gh api "repos/$REPO/releases?per_page=100" \
            --jq "[.[] | select(.tag_name==\"$TAG\") | .id] | first // empty" || true)
          if [ -n "$RID" ]; then
            echo "updating existing release $RID (no tag deletion)"
            gh api -X PATCH "repos/$REPO/releases/$RID" \
              -f draft=false -F prerelease=true \
              -f target_commitish="$GITHUB_SHA" \
              -f name="$RELEASE_NAME ($TAG)" \
              -f body="$NOTES" >/dev/null
            # 清掉旧附件，避免同名冲突
            for aid in $(gh api "repos/$REPO/releases/$RID/assets" --jq '.[].id'); do
              gh api -X DELETE "repos/$REPO/releases/assets/$aid" >/dev/null
            done
          else
            echo "creating new release"
            RID=$(gh api -X POST "repos/$REPO/releases" \
              -f tag_name="$TAG" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="$RELEASE_NAME ($TAG)" \
              -F prerelease=true \
              -f body="$NOTES" \
              --jq '.id')
          fi
          echo "release id: $RID"

          shopt -s nullglob
          for f in dist/*.hap; do
            echo "uploading $f"
            gh api -X POST "https://uploads.github.com/repos/$REPO/releases/$RID/assets?name=$(basename "$f")" \
              -H "Content-Type: application/octet-stream" \
              --input "$f" >/dev/null
          done

          gh api "repos/$REPO/releases/$RID" --jq '.html_url'
