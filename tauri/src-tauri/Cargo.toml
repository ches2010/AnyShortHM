[package]
name = "anyshort-tauri"
version = "1.0.0-beta.1"
description = "AnyShort client built with Tauri 2 + Vue 3"
authors = ["ches2010"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "anyshort_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ---------------------------------------------------------------------------
# HarmonyOS 构建（Graphical）：
# 按官方 feat/open-harmony 分支构建时，启用下面的 patch。
# 详见 docs/OHOS_BUILD.md。
#
# [patch.crates-io]
# tauri = { git = "https://github.com/tauri-apps/tauri", branch = "feat/open-harmony" }
# tauri-build = { git = "https://github.com/tauri-apps/tauri", branch = "feat/open-harmony" }
# wry = { git = "https://github.com/tauri-apps/wry", branch = "feat/open-harmony" }
# tao = { git = "https://github.com/tauri-apps/tao", branch = "feat/open-harmony" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
